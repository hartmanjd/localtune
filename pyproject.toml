# The project's ID card. Tools like uv and pip read this file to learn what localtune is,
# what it needs, and how to package it so anyone can install it.

# Who and what localtune is: the facts shown when someone looks the package up or installs it.
# "dependencies" are the outside libraries localtune needs to run: pydantic gives every piece
# of data a fixed, checked shape; typer turns Python functions into terminal commands; rich
# prints tidy tables and colors in the terminal; XGBoost and numpy run the trained prediction
# model that ships with localtune. XGBoost comes in two packages: on Linux and Windows the
# CPU-only one, a tenth the size of the full one (whose extra size is GPU support localtune
# doesn't use), and on macOS the full one, which is small there.
[project]
name = "localtune"
dynamic = ["version"]
description = "Benchmark local LLMs on your own hardware: speed, memory use and power."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Justin Hartman" }]
requires-python = ">=3.10"
keywords = ["llm", "benchmark", "llama.cpp", "ollama", "gpu", "local ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "numpy>=2.2.6",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "xgboost-cpu>=3.2.0; sys_platform != 'darwin'",
    "xgboost>=3.2.0; sys_platform == 'darwin'",
]

# The links shown on localtune's PyPI page.
[project.urls]
Homepage = "https://localtune.io"

# Creates the "localtune" terminal command when the package is installed, and points it at
# the app in src/localtune/cli.py.
[project.scripts]
localtune = "localtune.cli:app"

# How the code in src/ gets bundled into an installable package. The version number is read
# from the package itself, so it only ever has to be changed in one place.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/localtune/__init__.py"

# Tools for people working on localtune, not for people using it: pytest runs the tests in
# tests/, and ruff keeps the code free of common mistakes and consistently formatted.
# The same checks run automatically on GitHub (see .github/workflows/ci.yml).
[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
